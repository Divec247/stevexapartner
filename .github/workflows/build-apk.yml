name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Check the server address is set
        run: |
          if grep -q 'STEVEXA_API = ""' docs/config.js; then
            echo "::error file=docs/config.js::Paste your Apps Script /exec URL into docs/config.js first (README step 5)."
            exit 1
          fi

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply app icons and splash screen
        run: |
          RES=android/app/src/main/res
          cp -r android-res/. $RES/
          find $RES -path '*drawable*' -name splash.png | while read f; do
            case "$f" in
              *land*) cp splash-src/land.png "$f" ;;
              *)      cp splash-src/port.png "$f" ;;
            esac
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STEVEXA-Partners-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
